<!DOCTYPE html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>

        <!--<video id="video" autoplay muted loop playsinline> 
            <source src="video/tunnel_bounce.mp4" type="video/mp4">
        </video> -->

        <model-viewer id="pilz" src="mushroom/mushroom_ar.glb" ar ar-modes="scene-viewer webxr quick-look" camera-controls tone-mapping="neutral" poster="mushroom/poster.webp" shadow-intensity="1.17" exposure="0.5" shadow-softness="1" auto-rotate min-camera-orbit="auto auto 20.45m" min-field-of-view="30deg">
            <div class="progress-bar hide" slot="progress-bar">
                <div class="update-bar"></div>
            </div>
            <button slot="ar-button" class="ar-button">
            View in your space
            </button>
            <div class="ar-prompt">
                <img src="mushroom/ar_hand_prompt.png">
            </div>

        </model-viewer>


       <!-- <script src="./script.js"></script> -->
        <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>


    </body>
    </html>
