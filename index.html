<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>

    <div class="model-container">
      <!-- Pilz -->
      <div id="pilz" class="model-item">
        <model-viewer src="mushroom/mushroom_single.glb" ar ar-modes="scene-viewer webxr quick-look" camera-controls tone-mapping="neutral" poster="mushroom/poster.webp" shadow-intensity="1.17" exposure="1.48" shadow-softness="1" auto-rotate min-camera-orbit="auto auto 20.45m" min-field-of-view="30deg">
          <div class="progress-bar hide" slot="progress-bar">
              <div class="update-bar"></div>
          </div>
          <button slot="ar-button" class="ar-button">
            View in your space
          </button>
          <div class="ar-prompt">
              <img src="mushroom/ar_hand_prompt.png">
          </div>
        </model-viewer>
      </div>

      <!-- Rose -->
      <div id="rose" class="model-item">
        <model-viewer src="rose/rose.glb" ar ar-modes="scene-viewer webxr quick-look" camera-controls tone-mapping="neutral" poster="mushroom/poster.webp" shadow-intensity="1.17" exposure="1.48" shadow-softness="1" auto-rotate min-camera-orbit="auto auto 20.45m" min-field-of-view="30deg" autoplay>
          <div class="progress-bar hide" slot="progress-bar">
              <div class="update-bar"></div>
          </div>
          <button slot="ar-button" class="ar-button">
            View in your space
          </button>
          <div class="ar-prompt">
              <img src="mushroom/ar_hand_prompt.png">
          </div>
        </model-viewer>
      </div>
    </div>

    <script src="./script.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  </body>
</html>
